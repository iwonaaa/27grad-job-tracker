      {name:'字节跳动',state:'open',label:'3 个已收录',text:'已补充游戏技术美术工程师、游戏战斗策划和创意视觉设计师三个具体2027届全职岗位。',url:'https://jobs.bytedance.com/campus'},
      {name:'哔哩哔哩',state:'open',label:'2 个全职岗',text:'已补充视频生成评测专家、游戏内容生态运营两个具体2027届全职岗位。',url:'https://jobs.bilibili.com/campus/positions'},
      {name:'畅游',state:'open',label:'10 个已收录',text:'官方2027届校招游戏美术类共24个职位，已优先收录动作、原画、3D、特效、UI与技术美术等10个匹配岗位。',url:'https://campus.changyou.com/'},
      {name:'鹰角网络',state:'open',label:'15 个已收录',text:'已补充原画、模型、动画、特效、UI、影视TD、技术美术、3D演出策划与音乐设计等具体2027届全职岗位。',url:'https://campus.hypergryph.com/'},
      {name:'深蓝互动',state:'open',label:'13 个已收录',text:'已补充UE5和《重返未来：1999》项目的原画、模型、动画、特效、GUI、视频编导等具体岗位。',url:'https://campus.bluepoch.com/'},
      {name:'乐元素',state:'open',label:'1 个第三方岗',text:'已从BOSS直聘补充游戏视频设计师；该岗位会保留第三方来源标识，需投递前复核。',url:'https://www.happyelements.com/'},
      {name:'莉莉丝游戏',state:'open',label:'3 个已收录',text:'已补充场景概念设计师、2D动画师（AFK）和VX设计师三个2027秋招正式岗位。',url:'https://lilithgames.jobs.feishu.cn/campus/'},
      {name:'叠纸游戏',state:'open',label:'1 个已收录',text:'2027秋季校园招聘已启动；已补充恋与深空3D动画美宣岗，其他美术、动画、策划岗位继续核验。',url:'https://career.papegames.com/campus'},
      {name:'库洛游戏',state:'open',label:'4 个已收录',text:'已补充游戏UI设计、UI开发、交互设计与用户研究等具体2027届秋招岗位；官网持续开放更多美术、策划、技术岗位。',url:'https://kurogame.jobs.feishu.cn/campus'},
      {name:'米哈游',state:'open',label:'36 个已收录',text:'已补充原画、模型、动画、特效、UI、视频、技术美术、文案与多类游戏策划等2027届全职岗位。',url:'https://jobs.mihoyo.com/#/campus/position?projectIds%5B0%5D=13'},
      {name:'完美世界',state:'open',label:'4 个第三方岗',text:'已补充剧情策划、系统策划、UI设计、美宣画师等2027秋招线索，均标记为第三方并需官网二次确认。',url:'https://jobs.games.wanmei.com/school.html'},
      {name:'爱奇艺',state:'paused',label:'暂未见细岗',text:'当前官方招聘页未检索到可确认的2027届全职影视创意细岗。',url:'https://zhaopin.iqiyi.com/'},
      {name:'快手',state:'watch',label:'校招已启',text:'2027届校招已开放；视频与内容创意的具体全职职位仍在等待官方详情页公开。',url:'https://zhaopin.kuaishou.cn/'},
      {name:'阿里影业 / 阿里集团',state:'open',label:'2 个相关岗',text:'未发现“阿里影业”独立的2027届职位；已补充阿里集团的游戏动画与AI体验设计师。',url:'https://campus-talent.alibaba.com/campus/position'}
    ];
    const stateKey = '27grad-creative-school-job-status-v2';
    const stored = JSON.parse(localStorage.getItem(stateKey) || '{}');
    jobs.forEach(job => { if (stored[job.id]) job.status = stored[job.id]; });
    const statuses = ['未投递','已投递','笔试 / 测评','面试中','Offer','已拒绝'];
    const filters = { city: root.querySelector('#filter-city'), company: root.querySelector('#filter-company'), role: root.querySelector('#filter-role'), status: root.querySelector('#filter-status') };
    const grid = root.querySelector('#jobs-grid');
    const empty = root.querySelector('#job-empty');
    const watchGrid = root.querySelector('#watch-grid');
    const count = root.querySelector('#job-count');
    const detail = root.querySelector('#job-detail');
    const detailFields = { title: root.querySelector('#detail-title'), meta: root.querySelector('#detail-meta'), jd: root.querySelector('#detail-jd'), start: root.querySelector('#detail-start'), end: root.querySelector('#detail-end'), pay: root.querySelector('#detail-pay'), note: root.querySelector('#detail-note') };
    const optionList = (element, values, allText) => { element.innerHTML = `<option value="">${allText}</option>${values.map(value => `<option value="${value}">${value}</option>`).join('')}`; };
    optionList(filters.city, [...new Set(jobs.flatMap(job => job.city.split('、')))].sort(), '全部城市');
    optionList(filters.company, [...new Set(jobs.map(job => job.companyType))], '全部公司类型');
    optionList(filters.role, [...new Set(jobs.map(job => job.roleType))], '全部岗位类型');
    optionList(filters.status, statuses, '全部状态');
    root.querySelector('#verified-total').textContent = `${jobs.length} 个`;
    root.querySelector('#company-total').textContent = `${companies.length + 1} 家`;
    root.querySelector('#city-total').textContent = `${new Set(jobs.flatMap(job => job.city.split('、')).filter(city => city !== '未公布')).size} 个`;
    const renderCompanies = () => {
      watchGrid.innerHTML = '';
      companies.forEach(company => {
        const card = document.createElement('article');
        card.className = 'watch-card';
        card.innerHTML = `<div class="watch-card-top"><strong>${company.name}</strong><span class="watch-status ${company.state}">${company.label}</span></div><p>${company.text}</p><a href="${company.url}" target="_blank" rel="noopener">官方招聘页 →</a>`;
        watchGrid.appendChild(card);
      });
    };
    let selectedId = null;
    const visibleJobs = () => jobs.filter(job => (!filters.city.value || job.city.includes(filters.city.value)) && (!filters.company.value || job.companyType === filters.company.value) && (!filters.role.value || job.roleType === filters.role.value) && (!filters.status.value || job.status === filters.status.value));
    const openDetail = job => {
      detailFields.title.textContent = job.role;
      detailFields.meta.textContent = `${job.company} · ${job.companyType} · ${job.city} · ${job.roleType}`;
      detailFields.jd.textContent = job.jd;
      detailFields.start.textContent = job.start;
      detailFields.end.textContent = job.end;
      detailFields.pay.textContent = job.pay;
      detailFields.note.textContent = `来源：${job.source || '官网招聘页'} · ${job.note}`;
      selectedId = job.id;
      detail.hidden = false;
      render();
      detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };
    const render = () => {
      const list = visibleJobs();
      count.textContent = `显示 ${list.length} / ${jobs.length} 个岗位`;
      grid.innerHTML = '';
      empty.hidden = list.length !== 0;
      if (!list.length) { return; }
      list.forEach(job => {
        const card = document.createElement('article');
        card.className = `job-card${selectedId === job.id ? ' is-active' : ''}`;
        const isThirdParty = (job.source || '').startsWith('第三方');
        const sourceText = isThirdParty ? '第三方线索' : '官网确认';
        card.innerHTML = `<div class="job-card-top"><span class="company-chip">${job.company}</span><span class="job-company-type"><span class="source-label${isThirdParty ? ' third-party' : ''}">${sourceText}</span>${job.companyType}</span></div><button class="job-open" type="button"><span class="job-title">${job.role}</span><span class="job-location">Base · ${job.city}</span></button><div><span class="role-chip">${job.roleType}</span></div><div class="job-dates">网申开始 · ${job.start}<br><span>截止 · ${job.end}</span></div><div class="job-card-foot"><a class="apply-link" href="${job.url}" target="_blank" rel="noopener">查看 / 投递 →</a><label class="status-field">投递进度<select aria-label="${job.company} ${job.role}的投递状态">${statuses.map(status => `<option value="${status}" ${status === job.status ? 'selected' : ''}>${status}</option>`).join('')}</select></label></div>`;
        card.querySelector('.job-open').addEventListener('click', () => openDetail(job));
        card.querySelector('.status-field select').addEventListener('change', event => { job.status = event.target.value; localStorage.setItem(stateKey, JSON.stringify(Object.fromEntries(jobs.map(item => [item.id, item.status])))); render(); });
        grid.appendChild(card);
      });
    };
    Object.values(filters).forEach(filter => filter.addEventListener('change', render));
    root.querySelector('#close-detail').addEventListener('click', () => { detail.hidden = true; });
    renderCompanies();
    render();
  })();
  </script>
</section>
